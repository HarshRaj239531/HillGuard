name: hillguard

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: hillguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hillguard
      POSTGRES_PASSWORD: hillguard_secure_pwd
      POSTGRES_DB: hillguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hillguard -d hillguard_db"]
      interval: 4s
      timeout: 4s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hillguard-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://hillguard:hillguard_secure_pwd@db:5432/hillguard_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
